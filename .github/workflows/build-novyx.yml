name: build-novyx
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Siapkan project NOVYX
        run: |
          ZIP=$(ls NOVYX-source*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Memakai arsip: $ZIP"
            mkdir -p _src
            unzip -q "$ZIP" -d _src
            GRADLEW=$(find _src -maxdepth 3 -name gradlew | head -1)
          else
            echo "Arsip NOVYX-source.zip tidak ada, mencari project langsung di repo"
            GRADLEW=$(find . -maxdepth 3 -name gradlew -not -path './_src/*' | head -1)
          fi
          if [ -z "$GRADLEW" ]; then
            echo "::error::Project NOVYX tidak ditemukan. Upload NOVYX-source.zip ke root repo (satu level dengan folder .github)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ada di: $PROJECT_DIR"
          ls "$PROJECT_DIR"
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit test (tidak memblokir APK)
        id: unittest
        continue-on-error: true
        run: ./gradlew testFossDebugUnitTest --continue --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Build APK debug
        run: ./gradlew assembleFossDebug --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Build APK release
        run: ./gradlew assembleFossRelease --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Tanda tangani APK dengan kunci tetap NOVYX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          DBG=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          REL=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          $APKSIGNER sign --ks ci/novyx.keystore --ks-key-alias novyx --ks-pass pass:novyx123 --key-pass pass:novyx123 --out dist/NOVYX-debug.apk "$DBG"
          $APKSIGNER sign --ks ci/novyx.keystore --ks-key-alias novyx --ks-pass pass:novyx123 --key-pass pass:novyx123 --out dist/NOVYX-release.apk "$REL"
          echo "Sertifikat penandatangan:"
          keytool -list -v -keystore ci/novyx.keystore -storepass novyx123 | grep -E "SHA1|SHA256"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: NOVYX-apk
          path: ${{ env.PROJECT_DIR }}/dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: ${{ env.PROJECT_DIR }}/**/build/reports/tests/**
          if-no-files-found: ignore
